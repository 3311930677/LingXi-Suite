[package]
name = "overlay"
version = "0.1.0"
edition = "2021"
description = "LingXi pet overlay: a display panel for the OwO agent engine"

# Standalone crate (excluded from the workspace): requires the MSVC toolchain
# and WebView2 to build, unlike the GNU-based rest of the project.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
owo-bridge = { path = "../../crates/owo-bridge" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# 原生文件选择对话框（挑选引擎 exe 路径）。
rfd = "0.15"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # JobObjects 的 CreateJobObjectW 带 SECURITY_ATTRIBUTES 参数，依赖本特性
    # （原先由已退役的 Win32_Security_Cryptography 传递启用）。
    "Win32_Security",
] }
