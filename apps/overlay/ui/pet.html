<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵犀桌宠</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <button class="pet idle" id="pet" aria-label="灵犀桌宠" title="点我打开操作菜单（审批 / 中止任务 / 打开工作台 / 隐藏）；拖动可移动，在身上滑来滑去是摸摸头">
      <span class="halo"></span>
      <div class="avatar" id="pet-avatar" role="img" aria-label="灵犀桌宠形象">
        <img id="pet-avatar-img" src="assets/skins/lingxi-hamster/idle.png" alt="" draggable="false" />
      </div>
      <span class="fx-layer" id="fx" aria-hidden="true"></span>
      <span class="bubble" id="bubble">灵犀</span>
    </button>
    <div class="skin-menu" id="skin-menu" hidden></div>
    <script src="pet.js"></script>
  </body>
</html>
