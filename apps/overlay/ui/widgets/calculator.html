<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器 · 灵犀</title>
<link rel="stylesheet" href="widget.css">
<style>
.expr-input { font-size: 14px; font-family: Consolas, "Cascadia Mono", monospace; }
.result-display {
  background: #1e2024;
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  min-height: 50px;
  max-height: 88px;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  font: 21px Consolas, "Cascadia Mono", monospace;
  color: var(--brand);
  word-break: break-all;
  text-align: right;
  font-variant-numeric: tabular-nums;
  scrollbar-width: thin;
}
.result-display.error { color: var(--err); font-size: 12px; font-family: inherit; }
.result-display.pending { color: var(--text-faint); }
.keypad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 1fr;
  gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
}
.key {
  padding: 0;
  min-height: 38px;
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: 14px inherit;
  cursor: pointer;
  transition: background .1s, border-color .1s;
}
.key:hover { background: var(--surface-hi); border-color: var(--stroke-hi); }
.key:active { transform: translateY(0.5px); }
.key.op { color: var(--brand); font-weight: 600; }
.key.eq {
  background: var(--brand-dim);
  color: var(--brand-hi);
  border-color: rgba(76, 194, 255, 0.35);
  font-weight: 600;
}
.key.eq:hover { background: rgba(76, 194, 255, 0.2); border-color: var(--brand); }
.key.fn { color: var(--warn); font-size: 12.5px; }
</style>
</head>
<body>
<div class="widget-titlebar">
  <div class="title">计算器</div>
  <button class="widget-close" id="widget-close" title="关闭 (Esc)">×</button>
</div>
<div class="widget-body">
  <input type="text" class="expr-input" id="expr" placeholder="输入算式，如 1+2*3" autocomplete="off">
  <div class="result-display" id="result">=</div>
  <div class="keypad">
    <button class="key fn" data-key="C">C</button>
    <button class="key fn" data-key="←">←</button>
    <button class="key fn" data-key="(">(</button>
    <button class="key fn" data-key=")">)</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key op" data-key="/">÷</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key op" data-key="*">×</button>
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key op" data-key="-">−</button>
    <button class="key" data-key="0">0</button>
    <button class="key" data-key=".">.</button>
    <button class="key eq" data-key="=">=</button>
    <button class="key op" data-key="+">+</button>
  </div>
</div>
<script src="widget.js"></script>
<script>
"use strict";
const el = {
  expr: document.getElementById("expr"),
  result: document.getElementById("result"),
};
let calcTimer = null;

async function calculate() {
  const expr = el.expr.value.trim();
  if (!expr) {
    el.result.textContent = "=";
    el.result.className = "result-display";
    return;
  }
  el.result.textContent = "计算中...";
  el.result.className = "result-display pending";
  try {
    let text;
    if (invoke) {
      const res = await invoke("widget_calculate", { expression: expr });
      text = res.result;
    } else {
      // 浏览器预览无后端：只做白名单内的纯四则运算兜底，
      // 避免把原始报错直接展示给用户。
      if (!/^[-+*/%().\d\s]+$/.test(expr)) throw new Error("无法解析该表达式");
      const v = Function('"use strict"; return (' + expr + ');')();
      if (typeof v !== "number" || !isFinite(v)) throw new Error("无法计算结果");
      text = String(Math.round(v * 1e10) / 1e10);
    }
    el.result.textContent = "= " + text;
    el.result.className = "result-display";
  } catch(e) {
    el.result.textContent = e && e.message ? e.message : "计算失败";
    el.result.className = "result-display error";
  }
}

function scheduleCalc() {
  clearTimeout(calcTimer);
  calcTimer = setTimeout(calculate, 300);
}

el.expr.addEventListener("input", scheduleCalc);
el.expr.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); calculate(); }
});

document.querySelector(".keypad").addEventListener("click", (e) => {
  const key = e.target.dataset.key;
  if (!key) return;
  if (key === "C") {
    el.expr.value = "";
    el.result.textContent = "=";
    el.result.className = "result-display";
  } else if (key === "←") {
    el.expr.value = el.expr.value.slice(0, -1);
    scheduleCalc();
  } else if (key === "=") {
    calculate();
  } else {
    el.expr.value += key;
    scheduleCalc();
  }
  el.expr.focus();
});

setupWidgetClose("widget-calculator");
el.expr.focus();
</script>
</body>
</html>
