[package]
name = "owo-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-inference"]
# 透传本地推理开关，供 `--no-default-features` 在无 MSVC 工具链的机器上构建。
native-inference = ["owo-agent-core/native-inference", "owo-agent-server/native-inference"]

[dependencies]
owo-agent-core = { workspace = true, default-features = false }
owo-agent-server = { workspace = true, default-features = false }
owo-agent-ime = { path = "../owo-agent-ime" }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline = "14"
colored = "2"
uuid.workspace = true
reqwest.workspace = true
ratatui = "0.29"
crossterm = "0.28"

[[bin]]
name = "owo-agent"
path = "src/main.rs"
