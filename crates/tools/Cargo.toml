[package]
name = "lingxi-tools"
version.workspace = true
edition.workspace = true
description = "Tool trait, registry, and cross-platform built-in tools for the LingXi agent"

[features]
# Network-backed built-in tools (web_fetch, translate). Off by default so the
# base crate stays dependency-free for pure-logic consumers.
net = ["dep:ureq", "dep:native-tls"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件工具的子进程执行器需要 process/time/io-util；net feature 不再引入 tokio。
tokio = { version = "1", features = ["rt", "time", "process", "io-util"] }
ureq = { version = "2", default-features = false, features = [
    "native-tls",
    "gzip",
    "json",
], optional = true }
native-tls = { version = "0.2", optional = true }

# Local UTC offset for get_time (GetTimeZoneInformation).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
