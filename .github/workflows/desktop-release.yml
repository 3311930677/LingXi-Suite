name: desktop-release

# desktop branch: tag `desktop-v*` builds engine + pet overlay and publishes a Release.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout engine branch
        uses: actions/checkout@v4
        with:
          ref: engine
          path: engine-src

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-msvc --profile minimal
          rustup default stable-msvc

      - name: Build engine (release)
        shell: pwsh
        run: cargo build --release -p owo-agent-cli --manifest-path engine-src/agent-sdk/Cargo.toml

      - name: Stage engine for overlay bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/overlay/engine-dist | Out-Null
          Copy-Item engine-src/target/release/owo-agent.exe apps/overlay/engine-dist/owo-agent.exe -Force

      - name: Build pet overlay (release)
        shell: pwsh
        run: cargo build --release -p overlay --manifest-path apps/overlay/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Release layout: ui/pet (no-build frontend) + ui/assets (skins) beside
          # the exe; the engine exe ships alongside (pet shell auto-detects it).
          $out = "dist/LingXi-Pet-windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/ui" | Out-Null
          Copy-Item apps/overlay/target/release/overlay.exe "$out/LingXi-Pet.exe"
          Copy-Item apps/overlay/engine-dist/owo-agent.exe "$out/owo-agent.exe"
          Copy-Item apps/overlay/ui/pet "$out/ui/pet" -Recurse
          Copy-Item apps/overlay/ui/assets "$out/ui/assets" -Recurse
          Copy-Item apps/overlay/ui/pet-boot.html "$out/ui/pet-boot.html"
          Compress-Archive -Path $out -DestinationPath dist/LingXi-Pet-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-pet
          path: dist/LingXi-Pet-windows-x64.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LingXi-Pet-windows-x64.zip
          generate_release_notes: true