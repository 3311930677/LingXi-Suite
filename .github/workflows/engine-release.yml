name: engine-release

# engine 分支：打 `engine-v*` 标签时构建 owo-agent 引擎并发布 Release。
on:
  push:
    tags:
      - "engine-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-msvc --profile minimal
          rustup default stable-msvc

      - name: Build engine (release)
        shell: pwsh
        run: cargo build --release -p owo-agent-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/owo-agent.exe dist/
          Compress-Archive -Path dist/owo-agent.exe -DestinationPath dist/owo-agent-engine-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owo-agent-engine
          path: dist/owo-agent-engine-windows-x64.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/owo-agent-engine-windows-x64.zip
          generate_release_notes: true
